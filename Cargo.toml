[package]
authors = ["Kirill Bobyrev <kbobyrev.opensource@gmail.com>"]
categories = ["command-line-interface"]
description = "Chess engine"
documentation = "https://docs.rs/pabi"
edition = "2024"
homepage = "https://github.com/kirillbobyrev/pabi"
keywords = ["chess", "engine", "machine-learning"]
license = "Apache-2.0"
name = "pabi"
readme = "README.md"
repository = "https://github.com/kirillbobyrev/pabi"
rust-version = "1.95"
version = "2026.2.15"
include = [
  "/src/",
  "/generated/",
  "/Cargo.toml",
  "/Cargo.lock",
  "build.rs",
  "LICENSE",
  "README.md",
] # Reduce the package size by only including things necessary for building it.

[dependencies]
anyhow = "1.0.83"
arrayvec = "0.7.2"
bitflags = "2.2.1"
clap = { version = "4.5.15", features = ["derive", "wrap_help"] }
indicatif = "0.18.6"
itertools = "0.15.0"
# Use SmallRng for performance.
rand = { version = "0.10.2" }
rand_distr = "0.6.0"
rayon = "1.10.0"
shadow-rs = "2.0.0"
# TODO: Potentially remove this dependency.
# Used for probing tablebases.
shakmaty = "0.30.1"
shakmaty-syzygy = "0.28.1"

[build-dependencies]
rand = "0.10.2"
shadow-rs = "2.0.0"

[dev-dependencies]
assert_cmd = "2.0.16"
criterion = "0.8.2"
predicates = "3.1.2"
pretty_assertions = "1.1.0"
proptest = "1.5.0"
shadow-rs = "2.0.0"
# Used for testing and comparing against a reasonable baseline for correctness.
shakmaty = "0.30.1"

[[bench]]
harness = false
name = "chess"

# TODO: Test this out once the benchmarks are available and tweak specific
# values. So far, this gives around -8% on parsing FEN/EPD positions.
[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
# TODO: Tweak inline-threshold.
# TODO: Set profile-generate and profile-use (https://github.com/kirillbobyrev/pabi/issues/9).

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
macro_use_extern_crate = "warn"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
# TODO: Enable once the remaining public items are documented and the search
# stubs stop discarding results.
# let_underscore_drop = "warn"
# missing_docs = "warn"
# unused_results = "deny"

[lints.clippy]
missing_transmute_annotations = "allow"
# The core clippy groups. `perf` and `suspicious` are denied because a
# regression there is almost always a real bug; the rest warn to keep iteration
# friction low. `pedantic`/`nursery`/`cargo` are intentionally left off: they are
# dominated by low-value style noise and transitive-dependency reports.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
derivable_impls = "deny"
redundant_pattern_matching = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_rust_codeblocks = "deny"
unescaped_backticks = "deny"
